<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>El oráculo de los números</title>
  <script src="app.js" defer></script>
</head>
<body>
  <h1>🔮 El oráculo de los números</h1>

  <input type="number" id="entrada" min="1" max="100" placeholder="1-100">

  <p id="pista"></p>
  <p id="marcador">Intentos: 0</p>
</body>
</html>
